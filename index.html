<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cửa Hàng Thẻ Game & Giftcard</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Thanh Header -->
  <header class="navbar">
    <div class="logo">
      <i class="fa-solid fa-gamepad"></i> SHOP GAME
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Tìm kiếm sản phẩm...">
    </div>

    <div class="user-actions">
      <!-- Nút Đăng nhập / Đăng ký giống trong ảnh -->
      <button class="btn-auth" id="openAuthBtn">
        <i class="fa-solid fa-bag-shopping"></i>
        <span id="userStatusText">Đăng nhập/Đăng ký</span>
      </button>
    </div>
  </header>

  <!-- Danh sách sản phẩm mẫu -->
  <main class="container">
    <h2 class="section-title">Sản phẩm nổi bật</h2>
    <div class="grid">
      <div class="card">
        <div class="card-img">
          <i class="fa-solid fa-gift icon-lg"></i>
          <h3>GIFT CARD GIÁ RẺ</h3>
        </div>
        <div class="card-body">
          <p class="price">50.000 VNĐ</p>
          <button class="btn-buy">Mua ngay</button>
        </div>
      </div>

      <div class="card">
        <div class="card-img">
          <i class="fa-brands fa-nintendo-switch icon-lg"></i>
          <h3>GIFT CARD NINTENDO</h3>
        </div>
        <div class="card-body">
          <p class="price">100.000 VNĐ</p>
          <button class="btn-buy">Mua ngay</button>
        </div>
      </div>

      <div class="card">
        <div class="card-img">
          <i class="fa-solid fa-cube icon-lg"></i>
          <h3>MINECRAFT GIFTCARD</h3>
        </div>
        <div class="card-body">
          <p class="price">200.000 VNĐ</p>
          <button class="btn-buy">Mua ngay</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Hộp thoại Popup Đăng nhập / Đăng ký -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <button class="close-btn" id="closeModalBtn">&times;</button>
      
      <!-- Tab chuyển Đăng nhập / Đăng ký -->
      <div class="tab-header">
        <button class="tab-btn active" id="tabLogin">Đăng Nhập</button>
        <button class="tab-btn" id="tabRegister">Đăng Ký</button>
      </div>

      <!-- Form Đăng Nhập -->
      <form id="formLogin" class="auth-form active">
        <div class="input-group">
          <label>Tên tài khoản / Email</label>
          <input type="text" id="loginUser" required placeholder="Nhập tên đăng nhập">
        </div>
        <div class="input-group">
          <label>Mật khẩu</label>
          <input type="password" id="loginPass" required placeholder="Nhập mật khẩu">
        </div>
        <button type="submit" class="btn-submit">Đăng Nhập</button>
      </form>

      <!-- Form Đăng Ký -->
      <form id="formRegister" class="auth-form">
        <div class="input-group">
          <label>Tên tài khoản</label>
          <input type="text" id="regUser" required placeholder="Tạo tên tài khoản">
        </div>
        <div class="input-group">
          <label>Mật khẩu</label>
          <input type="password" id="regPass" required placeholder="Tạo mật khẩu">
        </div>
        <button type="submit" class="btn-submit">Đăng Ký Tài Khoản</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
